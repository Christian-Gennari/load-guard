# load guard configuration — copy to ~/.config/load-guard.conf and uncomment what you change.
# Shell syntax (KEY=VALUE). Every key is optional; `lg config` shows the effective values.
# Defaults marked "auto" are calculated from this machine's memory and core count.

# --- workers (agents) ---
# LG_MAX_WORKERS=3            # auto: LG_MAX_HEAVY + 1, 2–8. Workers (agents) at once
# LG_MIN_FREE_GB=4            # auto: 25 % of RAM, 1–4 GB. Free memory needed to admit a worker
# LG_MAX_LOAD=16              # auto: cores × 4/3. 1-minute load ceiling to admit a worker
# LG_STALE_HOURS=8            # ignore worker registrations older than this

# --- heavy jobs (lg run) ---
# LG_MAX_HEAVY=2              # auto: (RAM − LG_MIN_FREE_GB) / LG_JOB_MEM, 1–8. Heavy jobs at once, machine-wide
# LG_MAX_HEAVY_TOTAL=3        # auto: LG_MAX_HEAVY + 1. Heavy jobs + CI jobs at once
# LG_HEAVY_FREE_GB=4          # auto: = LG_MIN_FREE_GB. Free memory needed to start a heavy job
# LG_HEAVY_MAX_LOAD=12        # auto: cores. 1-minute load ceiling to start a heavy job
# LG_MAX_PSI=5                # memory pressure ceiling (% of time stalled)
# LG_JOB_MEM=4G               # auto: 30 % of RAM, 1–4 GB. MemoryMax per heavy job (one slot)
# LG_JOB_SWAP=256M            # MemorySwapMax per heavy job
# LG_JOB_CPU=400%             # auto: about a third of the cores. CPUQuota per heavy job (100% = 1 core)
# LG_JOB_NICE=10

# Commands that may run only one at a time (shell glob on the whole command line).
# Example: a full .NET test suite, but not a filtered run:
# LG_EXCLUSIVE_MATCH='*dotnet test*'
# LG_EXCLUSIVE_UNLESS='*--filter*'
# LG_EXCLUSIVE_MEM=6G         # default: = LG_JOB_MEM. MemoryMax of such a job; it takes LG_EXCLUSIVE_MEM / LG_JOB_MEM slots

# CI jobs on this machine count as heavy jobs. Default: GitHub Actions self-hosted runners.
# Set to an empty value to turn this off.
# LG_CI_PROCESS=Runner.Worker

# --- queue and watchdog ---
# LG_POLL=30                  # queue re-check seconds
# LG_WAIT_MAX=5400            # give up after this many seconds in a queue (exit 75)
# LG_KILL_FREE_GB=1.5         # auto: 10 % of RAM, 0.5–1.5 GB. Watchdog stops the newest heavy job below this
# LG_WATCH_INTERVAL=10        # watchdog check seconds
# LG_KEEP_DAYS=14            # the watchdog deletes metrics and events older than this
# LG_METRICS_EVERY=60         # one metrics line per this many seconds

# --- dashboard ---
# LG_DASH_PORT=8377
# LG_DASH_BIND=127.0.0.1      # use 0.0.0.0 only on a trusted network: the page has no login
# LG_DASH_INTERVAL=2          # seconds between live samples
# LG_DASH_ALLOW_WRITE=0       # 1 = the Settings view may change the limits from any address (default: localhost only)
